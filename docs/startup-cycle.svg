<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>The 0-1-2-3 startup cycle - what the panel counts through, ending at 150 °F and RUNNING</title>
  <defs>
    <!-- crown: the JoP0 flame ramp - yellow tongue to ground-shadow red, all four
         values measured from jop0-flame.png (the 2024 primary cut); the time axis
         runs cold-to-hot, so the ramp reads as the pit heating up. -->
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#f8ef24"/>
      <stop offset="0.45" stop-color="#f68d2a"/>
      <stop offset="0.78" stop-color="#f15a25"/>
      <stop offset="1"    stop-color="#e13926"/>
    </linearGradient>
  </defs>

  <!-- page ground -->
  <rect x="0" y="0" width="880" height="480" rx="14" fill="#0a0a12"/>

  <!-- the ramp crown: the table's single gradient moment -->
  <rect x="32" y="28" width="816" height="3" fill="url(#ramp)"/>

  <!-- header row: whispered -->
  <g font-size="11" letter-spacing="2.5" fill="#8a8aa6">
    <text x="48"  y="58">DISPLAY</text>
    <text x="150" y="58">HARDWARE</text>
    <text x="500" y="58" text-anchor="end">TIME</text>
    <text x="540" y="58">FUNCTION</text>
  </g>
  <line x1="32" y1="74" x2="848" y2="74" stroke="#2a2a3e" stroke-width="1"/>

  <!-- data rows: hairline rails, key column carries the ink -->
  <!-- row 0 -->
  <rect x="48" y="86" width="52" height="36" rx="6" fill="#060608" stroke="#2a2a3e"/>
  <text x="74" y="110" font-size="18" font-weight="bold" fill="#e8e8f4" text-anchor="middle">0</text>
  <text x="150" y="110" font-size="14" fill="#e8e8f4">auger</text>
  <text x="500" y="110" font-size="14" fill="#e8e8f4" text-anchor="end">45-60 s</text>
  <text x="540" y="110" font-size="13" fill="#e8e8f4">load the firebox with pellets</text>
  <line x1="32" y1="130" x2="848" y2="130" stroke="#2a2a3e" stroke-width="1"/>
  <!-- row 1 -->
  <rect x="48" y="142" width="52" height="36" rx="6" fill="#060608" stroke="#2a2a3e"/>
  <text x="74" y="166" font-size="18" font-weight="bold" fill="#e8e8f4" text-anchor="middle">1</text>
  <text x="150" y="166" font-size="14" fill="#e8e8f4">igniter</text>
  <text x="500" y="166" font-size="14" fill="#e8e8f4" text-anchor="end">90 s</text>
  <text x="540" y="166" font-size="13" fill="#e8e8f4">heat the pellets</text>
  <line x1="32" y1="186" x2="848" y2="186" stroke="#2a2a3e" stroke-width="1"/>
  <!-- row 2 -->
  <rect x="48" y="198" width="52" height="36" rx="6" fill="#060608" stroke="#2a2a3e"/>
  <text x="74" y="222" font-size="18" font-weight="bold" fill="#e8e8f4" text-anchor="middle">2</text>
  <text x="150" y="222" font-size="14" fill="#e8e8f4">fan + igniter</text>
  <text x="500" y="222" font-size="14" fill="#e8e8f4" text-anchor="end">30 s</text>
  <text x="540" y="222" font-size="13" fill="#e8e8f4">fan the pellets into flame</text>
  <line x1="32" y1="242" x2="848" y2="242" stroke="#2a2a3e" stroke-width="1"/>
  <!-- row 3 -->
  <rect x="48" y="254" width="52" height="36" rx="6" fill="#060608" stroke="#2a2a3e"/>
  <text x="74" y="278" font-size="18" font-weight="bold" fill="#e8e8f4" text-anchor="middle">3</text>
  <text x="150" y="278" font-size="14" fill="#e8e8f4">fan + igniter</text>
  <text x="500" y="278" font-size="14" fill="#e8e8f4" text-anchor="end">30 s</text>
  <text x="540" y="278" font-size="13" fill="#e8e8f4">establish proof of fire: a 5 °F rise</text>
  <line x1="32" y1="298" x2="848" y2="298" stroke="#2a2a3e" stroke-width="1"/>
  <!-- row temp 1: the panel becomes the temperature readout; the fire is not proven yet -->
  <rect x="48" y="310" width="52" height="36" rx="6" fill="#060608" stroke="#2a2a3e"/>
  <text x="74" y="333" font-size="11" font-weight="bold" letter-spacing="1" fill="#e8e8f4" text-anchor="middle">TEMP</text>
  <text x="150" y="334" font-size="14" fill="#e8e8f4">fan + igniter</text>
  <text x="500" y="334" font-size="14" fill="#e8e8f4" text-anchor="end">until +5 °F</text>
  <text x="540" y="334" font-size="13" fill="#e8e8f4">still proving the fire</text>
  <line x1="32" y1="354" x2="848" y2="354" stroke="#2a2a3e" stroke-width="1"/>
  <!-- row temp 2: proof made, igniter out, climb -->
  <rect x="48" y="366" width="52" height="36" rx="6" fill="#060608" stroke="#2a2a3e"/>
  <text x="74" y="389" font-size="11" font-weight="bold" letter-spacing="1" fill="#e8e8f4" text-anchor="middle">TEMP</text>
  <text x="150" y="390" font-size="14" fill="#e8e8f4">fan + auger</text>
  <text x="500" y="390" font-size="14" fill="#e8e8f4" text-anchor="end">until 150 °F</text>
  <text x="540" y="390" font-size="13" fill="#e8e8f4">igniter off; the auger feeds the fire</text>
  <line x1="32" y1="410" x2="848" y2="410" stroke="#2a2a3e" stroke-width="1"/>

  <!-- footer: the payoff -->
  <text x="48" y="448" font-size="15"><tspan fill="#8a8aa6">at </tspan><tspan font-weight="bold" fill="#e13926">150 °F</tspan><tspan fill="#8a8aa6"> the fire state flips to </tspan><tspan font-weight="bold" fill="#7ddc7d">RUNNING</tspan><tspan fill="#8a8aa6"> - normal temperature control begins</tspan></text>
</svg>
