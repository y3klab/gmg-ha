<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>The 0-1-2-3 startup cycle - what the panel counts through, ending at 150 °F and RUNNING</title>
  <defs>
    <!-- the flame rail: JoP0's measured flame, yellow tongue to ground-shadow red;
         the time axis runs cold-to-hot, so the ramp reads as the pit heating up. -->
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fcee23"/>
      <stop offset="0.45" stop-color="#f78d29"/>
      <stop offset="0.78" stop-color="#f15b24"/>
      <stop offset="1"    stop-color="#df3a26"/>
    </linearGradient>
  </defs>

  <!-- transparent ground: the table sits on the page like text -->
  <rect x="0" y="4" width="880" height="3" fill="url(#ramp)"/>

  <g font-size="11" letter-spacing="2.5" fill="#7d8590">
    <text x="16"  y="36">DISPLAY</text>
    <text x="150" y="36">HARDWARE</text>
    <text x="500" y="36" text-anchor="end">TIME</text>
    <text x="540" y="36">FUNCTION</text>
  </g>
  <line x1="0" y1="52" x2="880" y2="52" stroke="#30363d" stroke-width="1"/>

  <g font-size="14" fill="#e6edf3">
    <text x="42" y="84" font-size="16" font-weight="bold" text-anchor="middle">0</text>
    <text x="150" y="84">auger</text>
    <text x="500" y="84" text-anchor="end">45-60 s</text>
    <text x="540" y="84" font-size="13">load the firebox with pellets</text>

    <text x="42" y="126" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="150" y="126">igniter</text>
    <text x="500" y="126" text-anchor="end">90 s</text>
    <text x="540" y="126" font-size="13">heat the pellets</text>

    <text x="42" y="168" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    <text x="150" y="168">fan + igniter</text>
    <text x="500" y="168" text-anchor="end">30 s</text>
    <text x="540" y="168" font-size="13">fan the pellets into flame</text>

    <text x="42" y="210" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    <text x="150" y="210">fan + igniter</text>
    <text x="500" y="210" text-anchor="end">30 s</text>
    <text x="540" y="210" font-size="13">establish proof of fire: a 5 °F rise</text>

    <text x="42" y="252" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">TEMP</text>
    <text x="150" y="252">fan + igniter</text>
    <text x="500" y="252" text-anchor="end">until +5 °F</text>
    <text x="540" y="252" font-size="13">still proving the fire</text>

    <text x="42" y="294" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">TEMP</text>
    <text x="150" y="294">fan + auger</text>
    <text x="500" y="294" text-anchor="end">until 150 °F</text>
    <text x="540" y="294" font-size="13">igniter off; the auger feeds the fire</text>
  </g>

  <g stroke="#30363d" stroke-width="1">
    <line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="142" x2="880" y2="142"/>
    <line x1="0" y1="184" x2="880" y2="184"/>
    <line x1="0" y1="226" x2="880" y2="226"/>
    <line x1="0" y1="268" x2="880" y2="268"/>
    <line x1="0" y1="310" x2="880" y2="310"/>
  </g>

  <text x="16" y="348" font-size="15"><tspan fill="#7d8590">at </tspan><tspan font-weight="bold" fill="#df3a26">150 °F</tspan><tspan fill="#7d8590"> the fire state flips to </tspan><tspan font-weight="bold" fill="#7ddc7d">RUNNING</tspan><tspan fill="#7d8590"> - normal temperature control begins</tspan></text>

  <!-- the JoP0 mark, hand-set as text: capital J, lower o, capital P, and the
       zero riding high like a degree mark (per the brand registry, a flat-set
       "Jopo"/"JOP0" is not the mark). No pack artwork - license-clean. -->
  <text x="880" y="348" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold"><tspan font-size="15" fill="#7d8590">JoP</tspan><tspan font-size="10" dy="-5" fill="#f78d29">0</tspan></text>
</svg>
